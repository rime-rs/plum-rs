[package]
edition = "2024"
license = "LGPL-3.0-or-later"
name = "plum-rs"
version = "0.1.6"

[[bin]]
name = "rime-install"
path = "src/main.rs"

[features]
vendored-openssl = ["git2/vendored-openssl"]

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.6.7", features = ["derive", "env"]}
dirs-next = "2"
git2 = {version = "0.21.0", features = ["https", "vendored-libgit2"]}
glob = "0.3.4"
serde = {version = "1.0.229", features = ["derive"]}
thiserror = "2.0.21"
ureq = "3.4.2"
yaml_serde = "0.10.7"
zip = {version = "9.0.3", default-features = false, features = ["deflate"]}
tempfile = "3"
url = "2"
httpdate = "1.0.3"
sha2 = "0.11.0"
tar = "0.4.46"
flate2 = "1.1.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
