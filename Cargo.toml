[package]
edition = "2024"
license = "LGPL-3.0-or-later"
name = "plum-rs"
version = "0.1.3"

[[bin]]
name = "rime-install"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.6.7", features = ["derive", "env"]}
dirs-next = "2"
git2 = "0.21.0"
glob = "0.3.4"
serde = {version = "1.0.229", features = ["derive"]}
thiserror = "2.0.21"
ureq = "3.4.2"
yaml_serde = "0.10.7"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"