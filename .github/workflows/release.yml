
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: windows

          # Windows GNU x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            kind: windows-gnu

          # Windows MSVC ARM64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows

          # Linux GNU x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            kind: linux-gnu

          # Linux GNU ARM64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            kind: linux-gnu

          # Linux MUSL x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            kind: linux-musl

          # Linux MUSL ARM64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: linux-musl

          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            kind: macos

          # macOS Apple Silicon
          - os: macos-15
            target: aarch64-apple-darwin
            kind: macos

    env:
      BINARY_NAME: rime-install
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows GNU toolchain
      - name: Setup MinGW
        if: matrix.kind == 'windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            make
            perl

      # Linux native dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            perl \
            libssl-dev \
            binutils

      # MUSL static toolchain
      - name: Install MUSL toolchain
        if: matrix.kind == 'linux-musl'
        shell: bash
        run: |
          sudo apt-get install -y musl-tools

          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          fi

      # Cache Cargo dependencies
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build Windows GNU
      - name: Build Windows GNU
        if: matrix.kind == 'windows-gnu'
        shell: msys2 {0}
        run: |
          export CC_x86_64_pc_windows_gnu=gcc
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc

          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target }}" \
            --bin rime-install \
            --features git2/vendored-openssl,git2/vendored-libgit2

      # Build all other targets
      - name: Build
        if: matrix.kind != 'windows-gnu'
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target }}" \
            --bin rime-install \
            --features git2/vendored-openssl,git2/vendored-libgit2

      # Collect Windows binary
      - name: Collect Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/rime-install.exe" `
            "dist/rime-install-${{ matrix.target }}.exe"

      # Collect Linux and macOS binary
      - name: Collect Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist

          cp \
            "target/${{ matrix.target }}/release/rime-install" \
            "dist/rime-install-${{ matrix.target }}"

          chmod +x "dist/rime-install-${{ matrix.target }}"

          file "dist/rime-install-${{ matrix.target }}"

      # Verify MUSL is statically linked
      - name: Verify MUSL static linking
        if: matrix.kind == 'linux-musl'
        shell: bash
        run: |
          binary="dist/rime-install-${{ matrix.target }}"

          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::MUSL binary has a dynamic interpreter"
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "::error::MUSL binary has dynamic dependencies"
            exit 1
          fi

          echo "Static linking verified"

      # Upload temporary build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # Ensure all nine binaries exist
      - name: Verify artifact count
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f | wc -l)

          if [[ "$count" -ne 9 ]]; then
            echo "::error::Expected 9 binaries, found $count"
            exit 1
          fi

          echo "All 9 binaries collected"

      # Generate SHA256 checksums
      - name: Generate SHA256 checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum rime-install-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Publish to existing GitHub Release
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
