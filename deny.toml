
# cargo-deny configuration

[advisories]
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "LGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
